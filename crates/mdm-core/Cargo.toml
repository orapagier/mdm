[package]
name = "mdm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Download engine, aria2 supervision and browser IPC for MDM"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "net", "process", "time", "sync", "io-util", "fs",
] }
# No TLS features: the aria2 RPC endpoint is always plain HTTP on loopback.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# Bundled SQLite so the build does not depend on the distro's -devel package.
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
# Blob captures arrive base64-encoded: native messaging is JSON, which has no
# way to carry bytes.
base64 = "0.22"
log = "0.4"
toml = "0.8"
url = "2"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"

# Only the example driver needs these; the library itself logs through `log`.
[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
